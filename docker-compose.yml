services:
  # Gateway mode. ImmyBot credentials arrive per request on x-immybot-* headers.
  # Do not set IMMYBOT_INSTANCE_SUBDOMAIN, IMMYBOT_TENANT_ID, IMMYBOT_CLIENT_ID,
  # IMMYBOT_CLIENT_SECRET, or env_file here — that would put static vendor
  # credentials in the container. The project .env is used only for Compose
  # interpolation of CONDUIT_S2S_SECRET. For direct / single-tenant HTTP, pass
  # IMMYBOT_* on that process instead (see the README).
  immybot-mcp:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - MCP_TRANSPORT=http
      - MCP_HTTP_HOST=0.0.0.0
      - MCP_HTTP_PORT=8080
      - AUTH_MODE=gateway
      - NODE_ENV=production
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - CONDUIT_S2S_SECRET=${CONDUIT_S2S_SECRET:?set CONDUIT_S2S_SECRET}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const http = require('http'); http.get('http://127.0.0.1:8080/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
